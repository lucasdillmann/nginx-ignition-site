<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0c0e12" />
        <meta
            name="description"
            content="nginx ignition is a modern, intuitive web interface for the nginx web server. Manage virtual hosts, streams, SSL certificates and more — install it with a single Docker command."
        />
        <title>nginx ignition — A modern UI for the nginx web server</title>
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="nginx ignition" />
        <meta property="og:title" content="nginx ignition — A modern UI for the nginx web server" />
        <meta
            property="og:description"
            content="Manage virtual hosts, streams, SSL certificates and more from a clean, modern interface. Free and open source."
        />
        <meta property="og:url" content="https://nginxignition.app/" />
        <meta property="og:image" content="src/assets/og.jpg" />
        <meta name="twitter:card" content="summary_large_image" />
        <style>
            html {
                background: #0c0e12;
                color-scheme: dark;
            }
            body {
                margin: 0;
            }
            #boot {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                background: #0c0e12;
                color: #e9edf4;
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            #boot img {
                width: 64px;
                height: 64px;
                animation: boot-pulse 1.6s ease-in-out infinite;
            }
            #boot span {
                font-size: 15px;
                letter-spacing: 0.02em;
                color: #a3acbb;
            }
            @keyframes boot-pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.4;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                #boot img {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div id="boot">
                <img src="/src/assets/logo.svg" width="64" height="64" alt="" />
                <span>nginx ignition</span>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
